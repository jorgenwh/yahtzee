[project]
name = "yahtzee"
version = "0.0.1"
description = "Yahtzee game environment with AI agents"
requires-python = ">=3.12"
dependencies = [
    "black>=25.12.0",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "pyright>=1.1.407",
    "ruff>=0.14.10",
    "torch>=2.0.0",
    "tqdm>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.8.0",
    "pyright>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
indent-width = 4

[tool.hatch.build.targets.wheel]
packages = ["yahtzee"]
