name: Run lint check

on:
  push:
    branches:
      - '**' # Matches any branch
  pull_request:
    branches:
      - main

jobs:
  lint-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run black
        run: uv run black --check yahtzee/

      - name: Run ruff
        run: uv run ruff check yahtzee/

      - name: Run pyright
        run: uv run pyright yahtzee/
